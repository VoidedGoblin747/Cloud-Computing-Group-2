# Google App Engine config
runtime: python39
entrypoint: gunicorn -b :$PORT app:app

env_variables:
  # put the real MongoDB connection string here before deploying
  # (do NOT commit the real password)
  MONGO_URI: "mongodb://your-mongodb-ip:27017/task_tracker"

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto
